---
name: Publish staged release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable draft tag to verify and publish (for example, v0.2.0)
        required: true
        type: string

permissions: read-all

concurrency:
  group: jobman-diagnose-release
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish retained draft
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: main
      url: https://github.com/ryancswallace/jobman-diagnose/releases/tag/${{ inputs.tag }}
    permissions:
      actions: write
      attestations: read
      contents: write

    steps:
      - name: Checkout trusted verification logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve retained draft
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable semantic version tag such as v0.2.0." >&2
            exit 1
          fi
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          source_commit=$(git rev-parse --verify "${RELEASE_TAG}^{commit}")
          if ! git merge-base --is-ancestor "${source_commit}" origin/main; then
            echo "${RELEASE_TAG} must point to a commit on main." >&2
            exit 1
          fi
          release_state=$(gh release view "${RELEASE_TAG}" \
            --repo ryancswallace/Jobman-Diagnose \
            --json databaseId,isDraft,isPrerelease,tagName,targetCommitish \
            --jq '[.databaseId, .isDraft, .isPrerelease, .tagName, .targetCommitish] | @tsv')
          IFS=$'\t' read -r release_id is_draft is_prerelease resolved_tag target_commit \
            <<< "${release_state}"
          if [[ "${is_draft}" != "true" ||
                "${is_prerelease}" != "false" ||
                "${resolved_tag}" != "${RELEASE_TAG}" ]]; then
            echo "${RELEASE_TAG} is not the exact retained stable draft." >&2
            exit 1
          fi
          # GitHub commonly records the mutable default branch as
          # targetCommitish even though the release was created for an existing
          # immutable tag. The ancestry check above and tagged attestations
          # below establish source identity in that case. Any explicit tag or
          # commit target must still resolve exactly to the source commit.
          if [[ "${target_commit}" != "main" &&
                "${target_commit}" != "refs/heads/main" &&
                "${target_commit}" != "${source_commit}" &&
                "${target_commit}" != "${RELEASE_TAG}" &&
                "${target_commit}" != "refs/tags/${RELEASE_TAG}" &&
                "$(git rev-parse "${target_commit}^{commit}" 2>/dev/null || true)" != "${source_commit}" ]]; then
            echo "The retained draft target does not match ${RELEASE_TAG}." >&2
            exit 1
          fi
          echo "id=${release_id}" >> "${GITHUB_OUTPUT}"
          echo "source_commit=${source_commit}" >> "${GITHUB_OUTPUT}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download exact staged assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          gh release download "${RELEASE_TAG}" \
            --repo ryancswallace/Jobman-Diagnose \
            --dir dist
          ./devel/check-release.sh dist signed

      - name: Verify signatures, attestations, and executable identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          manifest="dist/jobman-diagnose_${RELEASE_TAG#v}_checksums.txt"
          cosign verify-blob \
            --bundle "${manifest}.sigstore.json" \
            --certificate-identity \
              "https://github.com/ryancswallace/Jobman-Diagnose/.github/workflows/release.yml@refs/tags/${RELEASE_TAG}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${manifest}"
          while read -r _ filename; do
            gh attestation verify "dist/${filename}" \
              --repo ryancswallace/Jobman-Diagnose \
              --signer-workflow ryancswallace/Jobman-Diagnose/.github/workflows/release.yml \
              --source-ref "refs/tags/${RELEASE_TAG}" >/dev/null
          done < "${manifest}"
          mkdir -p verify-bin
          tar -xzf "dist/jobman-diagnose_${RELEASE_TAG#v}_linux_amd64.tar.gz" \
            -C verify-bin jobman-diagnose
          version_output=$(verify-bin/jobman-diagnose --version)
          if [[ "${version_output}" != jobman-diagnose\ "${RELEASE_TAG#v}"* ]]; then
            echo "Staged executable version does not match ${RELEASE_TAG}: ${version_output}" >&2
            exit 1
          fi

      - name: Publish exact verified draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          published=$(gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            -F prerelease=false \
            --jq '[.id, .draft, .prerelease] | @tsv')
          if [[ "${published}" != "${RELEASE_ID}"$'\tfalse\tfalse' ]]; then
            echo "GitHub did not publish the exact verified release ID." >&2
            exit 1
          fi

      # Events created with GITHUB_TOKEN do not ordinarily start another
      # workflow. workflow_dispatch is the documented exception, so explicitly
      # start both post-release publishers after this workflow makes the draft
      # public. A release published through the GitHub UI continues to use each
      # publisher's release.published trigger instead.
      - name: Dispatch post-release distribution
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh workflow run publish-homebrew-formula.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f "tag=${RELEASE_TAG}"
          gh workflow run publish-cloudsmith-packages.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f "tag=${RELEASE_TAG}"
