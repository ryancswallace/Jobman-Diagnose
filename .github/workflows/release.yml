---
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: read-all

concurrency:
  group: jobman-diagnose-release
  cancel-in-progress: false

jobs:
  release:
    name: Build signed draft release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: main
      url: https://github.com/ryancswallace/jobman-diagnose/releases/tag/${{ github.ref_name }}
    permissions:
      attestations: write
      artifact-metadata: write
      contents: write
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release source
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a semantic version such as v1.2.3." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must point to a commit on the main branch." >&2
            exit 1
          fi
          if grep -Eq '^[[:space:]]*replace[[:space:]]+github.com/ryancswallace/jobman[[:space:]]*=>' go.mod; then
            echo "A release must require a tagged Jobman module, not a sibling checkout." >&2
            exit 1
          fi
          if grep -Eq '^[[:space:]]*github.com/ryancswallace/jobman[[:space:]]+v0\.0\.0[[:space:]]*$' go.mod; then
            echo "A release must require a published Jobman module version." >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.version
          check-latest: true
          cache-dependency-path: go.sum

      - name: Revalidate release source
        run: >-
          make mod-check format-check lint workflow-check vulncheck
          coverage-check evaluate docs release-check release-build build

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.46.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build and upload signed artifacts to a draft
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare attestation input
        run: |
          checksum_files=(dist/jobman-diagnose_*_checksums.txt)
          if [[ ${#checksum_files[@]} -ne 1 || ! -f "${checksum_files[0]}" ]]; then
            echo "Expected exactly one checksum manifest." >&2
            exit 1
          fi
          cp "${checksum_files[0]}" dist/attestation-checksums.txt

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/attestation-checksums.txt
