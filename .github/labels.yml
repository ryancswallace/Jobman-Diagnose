# Managed repository labels synchronized by the Labels workflow.

- name: bug
  color: "d73a4a"
  description: Something is broken or behaving incorrectly.
- name: enhancement
  color: "a2eeef"
  description: A new feature or improvement request.
- name: go
  color: "00add8"
  description: Go source, module metadata, or toolchain configuration.
- name: cli
  color: "1d76db"
  description: Command-line behavior, flags, or terminal presentation.
- name: api
  color: "1d76db"
  description: Public schemas, packages, or compatibility contracts.
- name: configuration
  color: "006b75"
  description: Diagnosis profile configuration, defaults, or discovery.
- name: providers
  color: "5319e7"
  description: Structured-generation adapters or provider conformance.
- name: evaluation
  color: "5319e7"
  description: Diagnosis quality, safety corpus, or model evaluation.
- name: documentation
  color: "0075ca"
  description: Documentation, examples, community files, or release guidance.
- name: tests
  color: "c2e0c6"
  description: Tests, fixtures, fuzzing, coverage, or test infrastructure.
- name: ci
  color: "0e8a16"
  description: Continuous integration or repository check behavior.
- name: github-actions
  color: "0e8a16"
  description: GitHub Actions workflow configuration.
- name: dependencies
  color: "0366d6"
  description: Go modules, Actions, images, or development-tool dependencies.
- name: packaging
  color: "fef2c0"
  description: Release archives, SBOMs, signing, or installation.
- name: security
  color: "b60205"
  description: Trust boundaries, vulnerability handling, or secret hygiene.
- name: automation
  color: "fbca04"
  description: Build, formatting, generation, or repository automation.
- name: dev-environment
  color: "d4c5f9"
  description: Devcontainer, editor, or local development setup.
- name: release
  color: "fef2c0"
  description: Release preparation, versioning, signing, or publishing.
- name: maintenance
  color: "c5def5"
  description: Repository maintenance that is not directly user-facing.
- name: breaking-change
  color: "b60205"
  description: Public behavior or schema change requiring migration.
- name: good first issue
  color: "7057ff"
  description: Good for a first contribution.
- name: help wanted
  color: "008672"
  description: Maintainer help is welcome.
- name: question
  color: "d876e3"
  description: Question or clarification request.
- name: needs-triage
  color: "ededed"
  description: Needs maintainer review and categorization.
- name: duplicate
  color: "cfd3d7"
  description: This issue or pull request already exists.
- name: invalid
  color: "e4e669"
  description: This does not look actionable as filed.
- name: wontfix
  color: "ffffff"
  description: This will not be worked on.
