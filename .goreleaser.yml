---
version: 2

project_name: jobman-diagnose

before:
  hooks:
    - go mod download
    - go mod verify

builds:
  - id: jobman-diagnose
    main: ./cmd/jobman-diagnose
    binary: jobman-diagnose
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -mod=readonly
    ldflags:
      - -s -w -buildid=
      - -X github.com/ryancswallace/jobman-diagnose/internal/buildinfo.Version={{ .Version }}
      - -X github.com/ryancswallace/jobman-diagnose/internal/buildinfo.Commit={{ .FullCommit }}
      - -X github.com/ryancswallace/jobman-diagnose/internal/buildinfo.Date={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - "386"
    ignore:
      - goos: darwin
        goarch: "386"

archives:
  - id: jobman-diagnose
    ids:
      - jobman-diagnose
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
      {{- with .Arm }}v{{ . }}{{ end }}
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - CITATION.cff
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - RELEASE.md
      - SECURITY.md
      - SUPPORT.md
      - THIRD_PARTY_NOTICES.md
      - docs/*.md

nfpms:
  - id: jobman-diagnose
    ids:
      - jobman-diagnose
    package_name: jobman-diagnose
    vendor: Jobman Diagnose contributors
    homepage: https://github.com/ryancswallace/Jobman-Diagnose
    maintainer: Ryan Wallace <ryancswallace@gmail.com>
    description: >-
      Deterministic and AI-assisted diagnostics for Jobman failures.
    license: MIT
    section: utils
    priority: optional
    formats:
      - apk
      - deb
      - rpm
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/jobman-diagnose/LICENSE
      - src: THIRD_PARTY_NOTICES.md
        dst: /usr/share/licenses/jobman-diagnose/THIRD_PARTY_NOTICES.md
      - src: README.md
        dst: /usr/share/doc/jobman-diagnose/README.md
      - src: docs/INSTALLATION.md
        dst: /usr/share/doc/jobman-diagnose/INSTALLATION.md
      - src: docs/CONFIGURATION.md
        dst: /usr/share/doc/jobman-diagnose/CONFIGURATION.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

sboms:
  - id: archives
    artifacts: archive
  - id: packages
    artifacts: package

signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes

changelog:
  sort: asc
  filters:
    exclude:
      - '^chore(?:\([^)]*\))?:'
      - '^ci(?:\([^)]*\))?:'
      - '^docs(?:\([^)]*\))?:'
      - '^test(?:\([^)]*\))?:'
      - '^Merge '

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot.{{ .ShortCommit }}"

release:
  github:
    owner: ryancswallace
    name: jobman-diagnose
  draft: true
  prerelease: auto
  footer: |
    **Install and verify:** see [RELEASE.md](https://github.com/ryancswallace/jobman-diagnose/blob/main/RELEASE.md).
