# Repository settings-as-code for the GitHub Settings app.
# Anyone who can change this file on the default branch can propose repository
# administration changes, so branch protection must cover it like source code.

repository:
  description: "Deterministic and AI-assisted diagnostics for Jobman failures."
  homepage: "https://jobman.tech/guides/diagnosis/"
  topics: "ai, cli, diagnostics, failure-analysis, go, jobman, llm, observability, troubleshooting"
  has_issues: true
  has_projects: false
  has_wiki: false
  has_discussions: false
  default_branch: "main"

  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  allow_auto_merge: true
  allow_update_branch: true
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: PR_BODY
  delete_branch_on_merge: true

  enable_automated_security_fixes: true
  enable_vulnerability_alerts: true

branches:
  - name: "main"
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: true
        require_last_push_approval: true
      required_status_checks:
        strict: true
        contexts:
          - Analyze Go
          - Dependency review
          - Quality and race tests
          - "Native race (macos-latest)"
          - "Native race (windows-latest)"
          - "Build (linux/amd64)"
          - "Build (linux/arm64)"
          - "Build (linux/386)"
          - "Build (darwin/amd64)"
          - "Build (darwin/arm64)"
          - "Build (windows/amd64)"
          - "Build (windows/arm64)"
          - "Build (windows/386)"
          - Release configuration
          - "Assembled binaries (minimum v1.4.0)"
          - "Assembled binaries (current main)"
          - Fuzz FuzzDecodeReport
          - Fuzz FuzzDecodeProposal
          - Fuzz FuzzDecodeEvidence
      enforce_admins: false
      required_linear_history: true
      allow_force_pushes: false
      allow_deletions: false
      required_conversation_resolution: true
      restrictions: null

environments:
  - name: "main"
    wait_timer: 0
    reviewers:
      # Stable numeric user ID for @ryancswallace.
      - id: 20177051
        type: "User"
    deployment_branch_policy:
      custom_branches:
        - name: main
          type: branch
        - name: "v*.*.*"
          type: tag
